<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airgap Table</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Airgap Table</h1>
    <p class="tag">Format, create and tidy Markdown tables. Runs entirely in this page. Nothing is sent, stored or loaded.</p>
  </header>

  <main>
    <section class="controls" aria-label="Controls">
      <div class="group">
        <button id="format" type="button" class="primary">Format</button>
        <button id="compact" type="button">Compact</button>
        <button id="transpose" type="button">Transpose</button>
      </div>
      <div class="group">
        <label for="align">Align all</label>
        <select id="align">
          <option value="keep">Keep</option>
          <option value="none">Default</option>
          <option value="left">Left</option>
          <option value="center">Center</option>
          <option value="right">Right</option>
        </select>
      </div>
      <div class="group">
        <label for="cols">Cols</label>
        <input id="cols" type="number" min="1" max="50" value="3">
        <label for="rows">Rows</label>
        <input id="rows" type="number" min="0" max="500" value="2">
        <button id="new" type="button">New table</button>
      </div>
    </section>

    <div class="panes">
      <div class="pane">
        <label for="input">Input <span class="hint">Markdown, CSV or TSV (paste from a spreadsheet)</span></label>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
      <div class="pane">
        <div class="pane-head">
          <label for="output">Output</label>
          <button id="copy" type="button">Copy</button>
          <button id="swap" type="button">Use as input</button>
        </div>
        <textarea id="output" spellcheck="false" readonly></textarea>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
